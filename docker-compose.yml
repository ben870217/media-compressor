services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-compressor-dev:local
    container_name: media-compressor-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_CHROMIUM_PATH=/usr/bin/chromium
    # 保持容器在背景運行而不自動啟動任何服務，等待使用者手動進入
    command: tail -f /dev/null
    restart: always
