name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: media-compressor/package-lock.json

      - name: Install and lint
        working-directory: media-compressor
        run: |
          npm ci
          npm run lint

      - name: Build versioned PWA archive
        working-directory: media-compressor
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          export VITE_RELEASE_VERSION="$version"
          export VITE_BASE_PATH="/media-compressor/releases/v${version}/"
          npm run build
          (cd dist && zip -qr "../../MediaCompressor-v${version}-PWA.zip" .)
          test -s "../MediaCompressor-v${version}-PWA.zip"

      - name: Validate release tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vX.Y.Z tags are supported: $tag" >&2
            exit 1
          fi
          version="$(node -p "require('./media-compressor/package.json').version")"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md release section for $VERSION is empty" >&2
            exit 1
          fi

      - name: Ensure release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if release_output="$(gh release view "$tag" 2>&1)"; then
            echo "A Release already exists for this tag and must not be overwritten." >&2
            exit 1
          else
            release_status=$?
          fi
          if [[ "$release_status" -ne 1 ]] || ! grep -Eqi 'release not found|http 404|not found' <<< "$release_output"; then
            echo "Could not verify whether a Release exists for $tag." >&2
            echo "$release_output" >&2
            exit 1
          fi

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "MediaCompressor-v${VERSION}-PWA.zip"
